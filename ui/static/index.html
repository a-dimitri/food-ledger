<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<!-- Theme, resolved before first paint so the light theme never flashes on a
     dark-mode load. Deliberately inline and dependency-free: the app module is
     deferred, and anything deferred is too late to stop the flash. -->
<script>
  (function () {
    var pref = null;
    try { pref = localStorage.getItem("ledger-theme"); } catch (e) { /* private mode */ }
    var dark = pref === "dark" ||
      (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) document.documentElement.dataset.theme = "dark";
  })();
</script>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f6f2e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
</head>
<body>

<!-- Top bar. Desktop: brand, the four sections, then phase pill · ⚙ · avatar.
     Mobile: ☰ (or ← on a sub-page), the page title, phase pill · avatar. -->
<header class="topbar">
  <button class="ic menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
  <a class="ic back-btn" id="back-btn" aria-label="Back" hidden>←</a>
  <a class="brand" href="#/today">Ledger</a>
  <nav class="sections" id="sections"></nav>
  <div class="page-title" id="page-title"></div>
  <div class="spacer"></div>
  <a class="phase-pill" id="phase-pill" href="#/nutrition/phases" hidden></a>
  <a class="ic settings-btn" id="settings-btn" href="#/settings" aria-label="Settings">⚙</a>
  <a class="avatar" id="avatar" href="#/profiles" aria-label="Profiles">·</a>
</header>
<nav class="subtabs" id="subtabs"></nav>

<!-- Mobile drawer -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Menu" hidden></aside>

<main id="view" class="view"></main>

<script type="module" src="/static/js/main.js"></script>
<script>
  // Register the service worker so the app is installable and opens offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW registration failed", e));
    });
  }
</script>
</body>
</html>
